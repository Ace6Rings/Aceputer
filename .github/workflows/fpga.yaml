name: fpga

on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Include FPGA SRAM model
        run: |
          python3 -c 'import re; t=open("info.yaml").read(); open("info.yaml","w").write(re.sub(r"(source_files:\s*\n)(\s*- )", r"\1\2sram_fpga.v\n\2", t))'

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttgf26c
