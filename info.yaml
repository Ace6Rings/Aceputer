# Tiny Tapeout project information
project:
  title:        "Aceputer"      # Project title
  author:       "Steven Xie"      # Your name
  discord:      "Ace6Rings"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "simple 16 bit cpu 8 bit datapath"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_Ace6Rings"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "defines.vh"
    - "sram_controller.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: "DAT_IN [0]"
  ui[2]: "DAT_IN [1]"
  ui[3]: "OPERAND_RS2 [0] / DAT_IN [2]"
  ui[4]: "OPERAND_RS2 [1] / DAT_IN [3]"
  ui[5]: "OPERAND_RS2 [2] / DAT_IN [4]"
  ui[6]: "OPERAND_RS1 [0] / DAT_IN [5]"
  ui[7]: "OPERAND_RS1 [1] / DAT_IN [6]"

  # Outputs
  uo[0]: "DAT_OUT [0]"
  uo[1]: "DAT_OUT [1]"
  uo[2]: "DAT_OUT [2]"
  uo[3]: "DAT_OUT [3]"
  uo[4]: "DAT_OUT [4]"
  uo[5]: "DAT_OUT [5]"
  uo[6]: "DAT_OUT [6]"
  uo[7]: "DAT_OUT [7]"

  # Bidirectional pins
  uio[0]: "OPERAND_RS1 [2]/ DAT_IN [7] / DAT_OUT [8]"
  uio[1]: "OPERAND_RD [0] / DAT_OUT [9]"
  uio[2]: "OPERAND_RD [1] / DAT_OUT [10]"
  uio[3]: "OPERAND_RD [2] / DAT_OUT [11]"
  uio[4]: "OPCODE [0] / DAT_OUT [12]"
  uio[5]: "OPCODE [1] / DAT_OUT [13]"
  uio[6]: "OPCODE [2] / DAT_OUT [14]"
  uio[7]: "OPCODE [3] / DAT_OUT [15]"

# Do not change!
yaml_version: 6
